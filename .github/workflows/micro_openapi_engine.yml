name: Micro-OpenAPI Pruning Engine

on:
  schedule:
    - cron: '18 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: micro-openapi-compile
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/micro_openapi.db
          key: micro-openapi-db-${{ github.run_id }}
          restore-keys: |
            micro-openapi-db-

      - name: Execute Micro-OpenAPI Engine
        run: python micro_openapi_engine.py

      - name: Commit and push permanent historical ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"
          git add data/history/

          if git diff --staged --quiet; then
            echo "No new schema drift detected."
          else
            git commit -m "chore(history): record API signature drift [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package public directory for Pages
        run: |
          mkdir -p public
          touch public/.nojekyll
          if [ -z "$(ls -A public | grep -v '^\.')" ]; then
            echo "Micro-OpenAPI Pruning Engine - Active ($(date -u))" > public/index.html
          fi
          tar -cvf /tmp/artifact.tar -C public .

      - name: Upload Artifacts to Pages
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: /tmp/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
